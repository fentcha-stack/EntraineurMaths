2 ddl :<span class=\"calc\">5,99 (5 %) &lt; 6,88 &lt; 9,21 (1 %)</span>"], "why": ["Vrai : (2 − 1)(3 − 1) = 2.", "Faux : 40 est l'effectif observé, le théorique est 48.", "Vrai : ≈ 6,88.", "Vrai : 6,88 > 5,99.", "Faux : 6,88 < 9,21."], "tip": "Astuce de vérification : dans une même colonne, les écarts obs − th sont opposés (−8 et +8, +2 et −2…). Si ce n'est pas le cas, tu t'es trompé sur un effectif théorique."}, {"id": "S2-08", "set": "S2", "num": 8, "k": "np", "title": "Sujet blanc n°2 · QCM8", "src": "", "stem": "On mesure un score d'anxiété chez 10 patients avant et après une séance de préparation à une intervention.\n <div class=\"tw\"><table class=\"d\"><tr><th>Patient</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>Avant</th><td>14</td><td>18</td><td>11</td><td>20</td><td>16</td><td>13</td><td>17</td><td>15</td><td>19</td><td>12</td></tr><tr><th>Après</th><td>10</td><td>15</td><td>11</td><td>14</td><td>17</td><td>9</td><td>13</td><td>12</td><td>14</td><td>13</td></tr></table></div>", "props": ["Les données sont appariées et on effectue un test de Wilcoxon.", "Le test porte sur N = 10 différences.", "La statistique du test vaut w = 3.", "Au risque de 5 %, la séance modifie significativement le score d'anxiété.", "Au risque de 1 %, la séance modifie significativement le score d'anxiété."], "ok": [0, 2, 3], "steps": ["Choix du test : mêmes patients mesurés deux fois, n ≤ 20, normalité inconnue → Wilcoxon.", "Différences avant − après :<span class=\"calc\">4 · 3 · 0 · 6 · −1 · 4 · 4 · 3 · 5 · −1</span>On omet la différence nulle (patient 3) → N = 9.", "Classer les valeurs absolues et attribuer les rangs (rang moyen en cas d'ex-aequo) :<div class=\"tw\"><table class=\"d\"><tr><th>|d|</th><td>1</td><td>1</td><td>3</td><td>3</td><td>4</td><td>4</td><td>4</td><td>5</td><td>6</td></tr><tr><th>Signe</th><td>−</td><td>−</td><td>+</td><td>+</td><td>+</td><td>+</td><td>+</td><td>+</td><td>+</td></tr><tr><th>Rang</th><td>1,5</td><td>1,5</td><td>3,5</td><td>3,5</td><td>6</td><td>6</td><td>6</td><td>8</td><td>9</td></tr></table></div>Les deux « 1 » occupent les rangs 1 et 2 → 1,5 chacun. Les deux « 3 » occupent 3 et 4 → 3,5. Les trois « 4 » occupent 5, 6 et 7 → 6.", "Sommes des rangs :<span class=\"calc\">w₋ = 1,5 + 1,5 = 3 &nbsp;&nbsp; w₊ = 3,5 + 3,5 + 6 + 6 + 6 + 8 + 9 = 42</span>Vérification : 3 + 42 = 45 = 9 × 10 / 2 ✓", "w = min(3 ; 42) = 3. Table de Wilcoxon pour n = 9 : 5 à 5 % et 1 à 1 %.<span class=\"calc\">3 ≤ 5 → rejet de H₀ à 5 % ; 3 > 1 → pas de rejet à 1 %</span>"], "why": ["Vrai : mesures répétées sur les mêmes sujets.", "Faux : la différence nulle est retirée, N = 9.", "Vrai : w = min(3 ; 42).", "Vrai : 3 ≤ 5.", "Faux : 3 > 1."], "tip": "Deux pièges dans le même exercice : la différence nulle à retirer (le N change la ligne de la table) et les ex-aequo à rang moyen. Vérifie toujours w₊ + w₋ = N(N + 1)/2."}, {"id": "S2-09", "set": "S2", "num": 9, "k": "essai", "title": "Sujet blanc n°2 · QCM9", "src": "", "stem": "Un essai randomisé en double aveugle compare un nouvel anticoagulant à la warfarine chez 600 patients en fibrillation atriale. Critère de jugement principal : survenue d'un AVC à 2 ans. Résultat : RR = 0,80 ; IC 95 % [0,62 ; 1,04] ; p = 0,09. Critère secondaire (saignements majeurs) : RR = 0,60 ; IC 95 % [0,42 ; 0,86].", "props": ["Il s'agit d'une étude expérimentale.", "Le nouvel anticoagulant est significativement plus efficace que la warfarine pour prévenir les AVC.", "Le résultat sur les saignements suffit à conclure à la supériorité du nouveau traitement.", "Pour le critère secondaire, la différence observée est statistiquement significative.", "La randomisation a pour but de rendre les deux groupes comparables."], "ok": [0, 3, 4], "steps": ["Type d'étude : l'investigateur attribue le traitement par tirage au sort → étude expérimentale (essai thérapeutique), le plus haut niveau de preuve.", "Critère principal : RR = 0,80 va dans le sens d'un bénéfice, mais l'IC [0,62 ; 1,04] contient 1 et p = 0,09 > 0,05 → pas de différence significative.", "Critère secondaire : IC [0,42 ; 0,86] exclut 1 → différence statistiquement significative.", "Mais la conclusion d'un essai repose sur le critère principal, défini à l'avance. Un critère secondaire significatif est une piste, pas une preuve d'efficacité.", "Randomisation : répartit au hasard les facteurs de confusion connus et inconnus → groupes comparables. Le double aveugle, lui, limite les biais de mesure."], "why": ["Vrai : traitement attribué par tirage au sort.", "Faux : l'IC contient 1 et p > 0,05.", "Faux : on conclut sur le critère principal.", "Vrai : l'IC exclut 1.", "Vrai : c'est son rôle."], "tip": "Même logique que le QCM ciguatéra (2023-24, 2025-26) : un HR ou RR < 1 avec un IC qui exclut 1 = bénéfice. Un critère secondaire seul ne suffit jamais."}, {"id": "S2-10", "set": "S2", "num": 10, "k": "inf", "title": "Sujet blanc n°2 · QCM10", "src": "", "stem": "À propos de la surveillance des maladies infectieuses et du dépistage, quelle(s) proposition(s) est (sont) exacte(s) ?", "props": ["Une zoonose est une maladie transmise naturellement de l'animal à l'homme.", "Un réseau sentinelle repose sur des professionnels de santé volontaires qui signalent les cas.", "Une surveillance exhaustive est surtout adaptée aux pathologies fréquentes.", "Un long délai entre le début de la maladie et l'apparition des symptômes est favorable au dépistage.", "La transmission par gouttelettes et la transmission aérienne nécessitent les mêmes mesures de protection."], "ok": [0, 1, 3], "steps": ["Zoonose : maladie ou infection transmise naturellement de l'animal vertébré à l'homme (leptospirose, rage, grippe aviaire…).", "Réseau sentinelle : échantillon de médecins (et non de patients) volontaires qui déclarent les cas → surveillance non exhaustive, adaptée aux maladies fréquentes (grippe, gastro-entérites).", "Surveillance exhaustive : on cherche à recenser tous les cas → réservée aux maladies rares et/ou graves (maladies à déclaration obligatoire). Pour une maladie fréquente et bénigne, elle est trop lourde : c'est le raisonnement du QCM Zika de 2022-23.", "Dépistage (critères OMS) : maladie fréquente et grave, phase préclinique assez longue pour détecter la maladie avant les symptômes, test simple et acceptable, traitement efficace à un stade précoce.", "Gouttelettes : grosses particules qui retombent vite → masque chirurgical et distance. Transmission aérienne : fines particules qui restent en suspension → masque FFP2, chambre adaptée. Les mesures sont différentes."], "why": ["Vrai : définition de la zoonose.", "Vrai : ce sont des médecins volontaires, pas des patients.", "Faux : l'exhaustif est réservé au rare et/ou grave.", "Vrai : la phase préclinique longue rend le dépistage utile.", "Faux : les mesures diffèrent (masque chirurgical vs FFP2)."], "tip": "Propositions C et E tirées presque mot pour mot des sujets 2021-22 et 2022-23."}];

  disc:{label:"Discordances : 1 · 0,5 · 0", v:[1, 0.5, 0, 0], info:"0 discordance = 1 point, 1 discordance = 0,5, 2 ou plus = 0, aucune case cochée = 0. C'est le barème le plus courant des UE santé de LAS."},
  edn:{label:"EDN : 1 · 0,5 · 0,2 · 0", v:[1, 0.5, 0.2, 0], info:"0 discordance = 1, 1 = 0,5, 2 = 0,2, 3 ou plus = 0. Barème national des épreuves dématérialisées de médecine."},
  tor:{label:"Tout ou rien", v:[1, 0, 0, 0], info:"1 point seulement si la grille est parfaite."},
  perso:{label:"Personnalisé", v:null, info:"Règle tes propres valeurs selon les modalités de contrôle de ta fac."}
};
function loadLocal(){ try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
let S = normalize(loadLocal());
function normalize(x){ const e = emptyState(); if (!x || typeof x !== "object") return e; for (const k in e) if (x[k] === undefined) x[k] = e[k]; for (const k in e.settings) if (x.settings[k] === undefined) x.settings[k] = e.settings[k]; return x; }
/* ---------------- barème ---------------- */
const fnum = v => (Math.round(v * 100) / 100).toString().replace(".", ",");
function scale(){ const st = S.settings, b = BAREMES[st.bareme] || BAREMES.disc; return b.v || st.custom; }
function pointsFor(g, p){ if ((!p || !p.length) && S.settings.emptyZero) return 0; const d = 5 - g; return scale()[Math.min(d, 3)]; }
function discLabel(g, p){ if ((!p || !p.length) && S.settings.emptyZero) return "aucune case cochée"; const d = 5 - g; return d === 0 ? "0 discordance" : d + " discordance" + (d > 1 ? "s" : ""); }
const baremeName = () => (BAREMES[S.settings.bareme] || BAREMES.disc).label;
const on20 = (pts, n) => n ? fnum(20 * pts / n) : "–";

let remoteRef = null, writing = false, pending = false, wTimer = null;
function setSync(kind){
  const el = $("sync");
  const txt = {local:"Enregistré sur cet appareil", connecting:"Connexion à ton compte…", synced:"Synchronisé sur ton compte", saving:"Enregistrement…", error:"Synchronisation impossible, données gardées sur cet appareil", full:"Stockage du compte plein : exporte puis efface d'anciennes données"}[kind];
  el.textContent = txt; el.classList.toggle("bad", kind === "error" || kind === "full");
}
function save(){ S.updated = Date.now(); saveLocal(); queueRemote(); updateCount(); }
function queueRemote(){ if (!remoteRef) return; clearTimeout(wTimer); wTimer = setTimeout(flush, 800); }
async function flush(){
  if (!remoteRef) return;
  if (writing){ pending = true; return; }
  writing = true; setSync("saving");
  try { await remoteRef.set({state: JSON.stringify(S), updated: S.updated}); setSync("synced"); }
  catch(e){
    const c = e && e.code;
    if (c === "unavailable") setTimeout(queueRemote, 1200 + Math.random() * 1500);
    else if (c === "quota_exceeded") setSync("full");
    else setSync("error");
  }
  writing = false;
  if (pending){ pending = false; flush(); }
}
async function initRemote(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  setSync("connecting");
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user){ setSync("local"); return; }
    const uid = await user.id();
    if (!uid){ setSync("local"); return; }
    const ref = db.doc("data/users/" + uid + "/carnet");
    const snap = await ref.get();
    remoteRef = ref;
    let remoteState = null;
    if (snap.exists){ try { remoteState = JSON.parse(snap.data().state); } catch(e){} }
    if (remoteState && (remoteState.updated || 0) > (S.updated || 0)){ S = normalize(remoteState); saveLocal(); render(); setSync("synced"); }
    else if ((S.updated || 0) > ((remoteState && remoteState.updated) || 0)) flush();
    else setSync("synced");
  } catch(e){ setSync("local"); }
}

/* ---------------- enregistrement d'une réponse ---------------- */
function grade(q, picked){ const ok = new Set(q.ok); let g = 0; for (let i = 0; i < 5; i++) if (picked.has(i) === ok.has(i)) g++; return g; }
function record(qid, picked){
  const q = BY_ID[qid], g = grade(q, picked), x = g === 5, now = Date.now(), p = [...picked].sort();
  S.attempts.push({q:qid, t:now, g, x, p});
  if (S.attempts.length > 1500) S.attempts.splice(0, S.attempts.length - 1500);
  let c = S.carnet[qid];
  if (!x){
    if (!c) c = S.carnet[qid] = {q:qid, first:now, count:0, types:[], note:"", streak:0};
    c.count++; c.last = now; c.p = p; c.streak = 0; c.status = "open";
  } else if (c){
    c.streak = (c.streak || 0) + 1; c.lastOk = now; c.status = c.streak >= 2 ? "ok" : "progress";
  }
  return {g, x};
}

/* ---------------- statistiques ---------------- */
function sessionPts(s){ return s.det ? s.det.reduce((a, [g, n]) => a + pointsFor(g, n ? [0] : []), 0) : s.x; }
function latestByQ(){ const m = {}; for (const a of S.attempts) m[a.q] = a; return m; }
function notionStats(){
  const latest = latestByQ(), recentAnn = S.annales.slice(-6), out = {};
  for (const k in NOTIONS){
    const qs = BANK.filter(q => q.k === k), done = qs.filter(q => latest[q.id]);
    const exact = done.filter(q => latest[q.id].x).length;
    const ptsSum = done.reduce((a, q) => a + pointsFor(latest[q.id].g, latest[q.id].p), 0);
    const open = Object.values(S.carnet).filter(c => c.status !== "ok" && BY_ID[c.q] && BY_ID[c.q].k === k).length;
    const ann = recentAnn.filter(a => (a.notions || []).includes(k)).length;
    const mastery = done.length ? ptsSum / done.length : null;
    const base = mastery === null ? 0.55 : 1 - mastery;
    const priority = WEIGHT[NOTIONS[k].lvl] * (base + 0.15 * Math.min(open, 3) + 0.12 * Math.min(ann, 3));
    out[k] = {k, total:qs.length, done:done.length, exact, open, ann, mastery, priority};
  }
  return out;
}
function reasonText(st){
  const parts = [];
  if (st.mastery === null) parts.push("jamais travaillée");
  else parts.push(`${Math.round(100 * st.mastery)} % des points sur ${st.done} question${st.done > 1 ? "s" : ""} faite${st.done > 1 ? "s" : ""}`);
  if (st.open) parts.push(`${st.open} erreur${st.open > 1 ? "s" : ""} à revoir`);
  if (st.ann) parts.push(`points perdus en annale ${st.ann} fois récemment`);
  parts.push(LEVELS[NOTIONS[st.k].lvl].replace("↗ ", "").toLowerCase() + " à l'examen");
  return parts.join(" · ");
}
function openCarnet(){ return Object.values(S.carnet).filter(c => c.status !== "ok" && BY_ID[c.q]); }
function updateCount(){ const n = openCarnet().length, el = $("cnt"); el.hidden = !n; el.textContent = n; }
function targetedIds(n = 10){
  const st = Object.values(notionStats()).sort((a, b) => b.priority - a.priority).slice(0, 3).map(s => s.k);
  const latest = latestByQ(), pool = [];
  const add = id => { if (!pool.includes(id)) pool.push(id); };
  openCarnet().filter(c => st.includes(BY_ID[c.q].k)).forEach(c => add(c.q));
  BANK.filter(q => st.includes(q.k) && !latest[q.id]).forEach(q => add(q.id));
  BANK.filter(q => st.includes(q.k) && latest[q.id] && !latest[q.id].x).forEach(q => add(q.id));
  BANK.filter(q => st.includes(q.k)).forEach(q => add(q.id));
  openCarnet().forEach(c => add(c.q));
  return shuffle(pool.slice(0, n));
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let tab = "dash", run = null, exam = null, carnetFilter = {status:"todo", k:"", type:""};
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => go(b.dataset.t));
function go(t){ tab = t; render(); window.scrollTo({top:0}); }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 2600); }
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.t === tab ? "page" : "false"));
  updateCount();
  if (tab === "dash") renderDash();
  else if (tab === "train") (exam ? renderExam() : run ? renderRun() : renderTrainMenu());
  else if (tab === "carnet") renderCarnet();
  else renderAnnales();
}

function chartHTML(){
  const pts = [
    ...S.annales.map(a => ({t:a.ts || Date.parse(a.date), v:20 * a.score / a.sur, s:"a", lbl:ANN_LABEL[a.a] || "Annale"})),
    ...S.sessions.map(s => ({t:s.t, v:2 * sessionPts(s), s:"b", lbl:"Sujet blanc n°" + s.s.slice(1)}))
  ].filter(p => isFinite(p.t) && isFinite(p.v)).sort((a, b) => a.t - b.t);
  if (pts.length < 2) return `<div class="empty">Enregistre au moins deux notes (annales dans l'onglet Annales, ou un sujet blanc) pour voir ta courbe.</div>`;
  const W = 640, H = 220, pl = 34, pr = 12, pt = 12, pb = 28;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = Math.max(t1 - t0, 1);
  const x = t => pl + (W - pl - pr) * (t - t0) / span, y = v => pt + (H - pt - pb) * (1 - v / 20);
  const grid = [0, 5, 10, 15, 20].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="${v === 10 ? 1.6 : 1}" ${v === 10 ? 'stroke-dasharray="5 4"' : ""}/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("");
  const line = s => { const p = pts.filter(q => q.s === s); return p.length > 1 ? `<polyline fill="none" stroke="${s === "a" ? "var(--pen)" : "var(--ok)"}" stroke-width="2" points="${p.map(q => x(q.t) + "," + y(q.v)).join(" ")}"/>` : ""; };
  const dots = pts.map(q => `<circle cx="${x(q.t)}" cy="${y(q.v)}" r="4.5" fill="${q.s === "a" ? "var(--pen)" : "var(--ok)"}"><title>${esc(q.lbl)} · ${fmtDate(q.t)} · ${fnum(q.v)}/20</title></circle>`).join("");
  const xl = `<text x="${pl}" y="${H - 8}" font-size="11" fill="var(--muted)">${fmtDate(t0)}</text><text x="${W - pr}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(t1)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Notes sur 20 au fil du temps">${grid}${line("a")}${line("b")}${dots}${xl}</svg>
    <div class="legend"><span><i style="background:var(--pen)"></i>Annales</span><span><i style="background:var(--ok)"></i>Sujets blancs</span><span>Notes sur 20 · ligne pointillée = 10/20 · survole un point pour le détail</span></div>`;
}

/* ---------------- séance une question à la fois ---------------- */
function startRun(label, ids){
  if (!ids.length){ toast("Aucune question dans cette sélection."); return; }
  exam = null; run = {label, ids, idx:0, picked:new Set(), done:null, score:0, results:[]};
  tab = "train"; render(); window.scrollTo({top:0});
}
function questionHTML(q, prefix){
  return `<div class="qmeta">${badge(q.k)} ${NOTIONS[q.k].name} · ${esc(q.title)}${q.src ? " · " + esc(q.src) : ""}</div>
    <div class="stem">${q.stem}</div>
    <p class="ask">Parmi les propositions suivantes, lesquelles sont correctes ?</p>
    <ol class="props">${q.props.map((p, i) => `<li class="prop" role="checkbox" aria-checked="false" tabindex="0" data-p="${prefix}" data-i="${i}"><span class="bubble">${L[i]}</span><span class="txt">${p}<span class="mark"></span></span></li>`).join("")}</ol>`;
}
function bindProps(scope, getSet, isLocked){
  scope.querySelectorAll(".prop").forEach(el => {
    const toggle = () => { if (isLocked(el)) return; const s = getSet(el), i = +el.dataset.i; s.has(i) ? s.delete(i) : s.add(i); el.setAttribute("aria-checked", s.has(i)); };
    el.onclick = toggle;
    el.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); } };
  });
}
function markProps(scope, q, picked){
  const ok = new Set(q.ok);
  scope.querySelectorAll(".prop").forEach(el => {
    const i = +el.dataset.i, right = picked.has(i) === ok.has(i);
    el.setAttribute("aria-checked", picked.has(i));
    el.classList.add(right ? "v-ok" : "v-ko");
    el.querySelector(".mark").textContent = (ok.has(i) ? "Vraie" : "Fausse") + (right ? "" : picked.has(i) ? " · tu l'as cochée" : " · à cocher");
  });
}
function corrHTML(q, picked, g){
  const x = g === 5;
  return `<div class="corr">
    <p class="ans ${x ? "good" : "bad"}">${x ? "Juste." : g + "/5 propositions bien jugées."} Réponse : ${letters(q.ok)} · ta réponse : ${letters([...picked].sort())}</p>
    <p class="small" style="margin:-4px 0 8px"><b>${fnum(pointsFor(g, [...picked]))} point${pointsFor(g, [...picked]) > 1 ? "s" : ""}</b> sur 1 au barème « ${esc(baremeName())} » (${discLabel(g, [...picked])})</p>
    <h3>Correction pas à pas</h3><ol class="steps">${q.steps.map(s => `<li>${s}</li>`).join("")}</ol>
    <h3>Proposition par proposition</h3><ul class="why">${q.why.map((w, i) => `<li><b>${L[i]}.</b> ${w}</li>`).join("")}</ul>
    <div class="tip"><b>Piège :</b> ${q.tip}</div></div>`;
}
function diagHTML(qid){
  const c = S.carnet[qid] || {types:[], note:""};
  return `<div class="diag" data-q="${qid}"><p>Ajoutée à ton carnet d'erreurs. Pourquoi tu t'es trompé ?</p>

function bindDiag(scope){
  scope.querySelectorAll(".diag").forEach(box => {
    const c = S.carnet[box.dataset.q]; if (!c) return;
    box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      c.types = c.types || []; const t = b.dataset.type;
      c.types.includes(t) ? c.types.splice(c.types.indexOf(t), 1) : c.types.push(t);
      b.setAttribute("aria-pressed", c.types.includes(t)); save();
    });
    const ta = box.querySelector("textarea"); let h;
    ta.oninput = () => { clearTimeout(h); h = setTimeout(() => { c.note = ta.value; save(); }, 700); };
    ta.onblur = () => { clearTimeout(h); if (c.note !== ta.value){ c.note = ta.value; save(); } };
  });
}
function renderRun(){
  const r = run;
  if (r.idx >= r.ids.length){
    const ok = r.results.filter(x => x.x).length, pts = r.results.reduce((s, x) => s + pointsFor(x.g, x.p), 0);
    $("main").innerHTML = `<div class="panel"><h2>Séance terminée : ${esc(r.label)}</h2>
      <p><b>${fnum(pts)}/${r.results.length} points, soit ${on20(pts, r.results.length)}/20</b> au barème « ${esc(baremeName())} ».</p>
      <p>${ok}/${r.results.length} questions entièrement justes · ${r.results.reduce((s, x) => s + x.g, 0)}/${r.results.length * 5} propositions bien jugées.</p>
      ${r.results.some(x => !x.x) ? `<p class="muted">Les questions ratées sont dans ton carnet d'erreurs. Elles en sortent après 2 réussites de suite.</p>` : ""}
      <div class="row"><button class="btn primary" id="again">Nouvelle séance points faibles</button><button class="btn" id="back">Retour au tableau de bord</button></div></div>`;
    $("again").onclick = () => startRun("Points faibles", targetedIds());
    $("back").onclick = () => { run = null; go("dash"); };
    return;
  }
  const q = BY_ID[r.ids[r.idx]];
  $("main").innerHTML = `<div class="runbar"><b>${esc(r.label)}</b><span class="muted small">Question ${r.idx + 1} sur ${r.ids.length}</span><button class="btn small" id="quit">Quitter la séance</button></div>
    <div class="sheet" id="sheet">${questionHTML(q, "r")}
      <div class="row" style="margin-top:14px"><button class="btn primary" id="check">Valider</button><button class="btn" id="next" hidden>${r.idx + 1 < r.ids.length ? "Question suivante" : "Voir le bilan"}</button></div>
      <div id="after"></div></div>`;
  r.picked = new Set(); r.done = null;
  const sheet = $("sheet");
  bindProps(sheet, () => r.picked, () => !!r.done);
  $("quit").onclick = () => { run = null; render(); };
  $("check").onclick = () => {
    if (r.done) return;
    r.done = record(q.id, r.picked); r.done.p = [...r.picked]; r.results.push(r.done); save();
    sheet.classList.add("locked"); markProps(sheet, q, r.picked);
    $("check").hidden = true; $("next").hidden = false;
    $("after").innerHTML = (r.done.x ? (S.carnet[q.id] ? `<p class="small" style="color:var(--ok);font-weight:700;margin-top:12px">${S.carnet[q.id].status === "ok" ? "Deuxième réussite de suite : cette erreur est maîtrisée." : "Bien : encore une réussite et elle sort du carnet."}</p>` : "") : diagHTML(q.id)) + corrHTML(q, r.picked, r.done.g);
    bindDiag($("after"));
  };
  $("next").onclick = () => { r.idx++; renderRun(); window.scrollTo({top:0}); };
}

/* ---------------- mode examen (sujets blancs) ---------------- */
function startExam(set){
  run = null;
  exam = {set, ids:BANK.filter(q => q.set === set).sort((a, b) => a.num - b.num).map(q => q.id), answers:{}, submitted:false, remaining:1800, timer:null, started:null};
  exam.ids.forEach(id => exam.answers[id] = new Set());
  tab = "train"; render(); window.scrollTo({top:0});
}
function renderExam(){
  const e = exam, fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  $("main").innerHTML = `<div class="runbar"><b>Sujet blanc n°${e.set.slice(1)} <span class="small muted">· barème « ${esc(baremeName())} »</span></b><span class="clock" id="clock">${fmt(e.remaining)}</span>
      <span class="row">${e.submitted ? "" : `<button class="btn small" id="startClock" ${e.timer ? "hidden" : ""}>Lancer le chrono</button>`}<button class="btn small" id="quit">${e.submitted ? "Fermer" : "Abandonner"}</button></span></div>
    <div id="examRes"></div>
    ${e.ids.map((id, k) => `<div class="sheet ${e.submitted ? "locked" : ""}" id="ex-${id}"><b>QCM${k + 1}</b>${questionHTML(BY_ID[id], id)}<div class="after"></div></div>`).join("")}
    ${e.submitted ? "" : `<div class="row" style="justify-content:center;margin:20px 0"><button class="btn primary" id="submit">Rendre ma copie</button></div>`}`;
  e.ids.forEach(id => bindProps($("ex-" + id), () => e.answers[id], () => e.submitted));
  $("quit").onclick = () => { if (!e.submitted && !confirm("Abandonner ce sujet blanc ? Tes réponses ne seront pas enregistrées.")) return; clearInterval(e.timer); exam = null; render(); };
  if ($("startClock")) $("startClock").onclick = () => {
    $("startClock").hidden = true; e.started = Date.now();
    e.timer = setInterval(() => { e.remaining--; const c = $("clock"); if (c){ c.textContent = fmt(Math.max(e.remaining, 0)); c.classList.toggle("late", e.remaining <= 300); } if (e.remaining <= 0){ clearInterval(e.timer); submitExam(); } }, 1000);
  };
  if ($("submit")) $("submit").onclick = submitExam;
  if (e.submitted) showExamResults();
}
function submitExam(){
  const e = exam; if (!e || e.submitted) return;
  clearInterval(e.timer); e.submitted = true;
  e.res = e.ids.map(id => ({id, ...record(id, e.answers[id]), p:[...e.answers[id]]}));
  const x = e.res.filter(r => r.x).length, g = e.res.reduce((s, r) => s + r.g, 0);
  S.sessions.push({s:e.set, t:Date.now(), x, g, det:e.res.map(r => [r.g, r.p.length]), d:e.started ? Math.round((Date.now() - e.started) / 1000) : null});
  save(); renderExam(); window.scrollTo({top:0});
}
function showExamResults(){
  const e = exam, x = e.res.filter(r => r.x).length, g = e.res.reduce((s, r) => s + r.g, 0);
  const pts = e.res.reduce((s, r) => s + pointsFor(r.g, r.p), 0);
  const missed = e.res.filter(r => !r.x).map(r => NOTIONS[BY_ID[r.id].k].name);
  $("examRes").innerHTML = `<div class="panel" style="border:2px solid var(--pen)"><h2>Note : ${on20(pts, e.res.length)}/20</h2>
    <p><b>${fnum(pts)}/10 points</b> au barème « ${esc(baremeName())} » · ${x}/10 QCM entièrement justes.</p>
    <div class="tw"><table class="list" style="margin:6px 0 10px"><tr><th>QCM</th>${e.res.map((r, i) => `<th>${i + 1}</th>`).join("")}</tr><tr><td class="small">Points</td>${e.res.map(r => `<td><b style="color:${r.x ? "var(--ok)" : pointsFor(r.g, r.p) > 0 ? "var(--warn)" : "var(--ko)"}">${fnum(pointsFor(r.g, r.p))}</b></td>`).join("")}</tr></table></div>
    <p>${g}/50 propositions bien jugées.${missed.length ? ` Erreurs sur : ${[...new Set(missed)].join(", ")}. Elles sont dans ton carnet.` : " Aucune erreur !"}</p>
    <p class="small muted">La correction détaillée est sous chaque QCM. Pour les questions ratées, indique pourquoi tu t'es trompé : ça alimente ton carnet.</p></div>`;
  e.res.forEach(r => {
    const q = BY_ID[r.id], box = $("ex-" + r.id);
    markProps(box, q, e.answers[r.id]);
    box.querySelector(".after").innerHTML = (r.x ? "" : diagHTML(r.id)) + corrHTML(q, e.answers[r.id], r.g);
    bindDiag(box);
  });
}

/* ---------------- carnet d'erreurs ---------------- */
function statusOf(c){ return c.status === "ok" ? "ok" : c.status === "progress" ? "progress" : "open"; }
function renderCarnet(){
  const all = Object.values(S.carnet).filter(c => BY_ID[c.q]);
  const f = carnetFilter;
  const list = all.filter(c => {
    const s = statusOf(c);
    if (f.status === "todo" && s === "ok") return false;
    if (f.status === "ok" && s !== "ok") return false;
    if (f.k && BY_ID[c.q].k !== f.k) return false;
    if (f.type && !(c.types || []).includes(f.type)) return false;
    return true;
  }).sort((a, b) => (statusOf(a) === "ok") - (statusOf(b) === "ok") || b.count - a.count || b.last - a.last);
  const typeCount = {}; all.forEach(c => (c.types || []).forEach(t => typeCount[t] = (typeCount[t] || 0) + 1));
  const topType = Object.entries(typeCount).sort((a, b) => b[1] - a[1])[0];
  const untagged = all.filter(c => statusOf(c) !== "ok" && !(c.types || []).length).length;
  const todo = all.filter(c => statusOf(c) !== "ok");
  $("main").innerHTML = `
    <div class="stats">
      <div class="stat"><b>${all.filter(c => statusOf(c) === "open").length}</b><span>à revoir</span></div>
      <div class="stat"><b>${all.filter(c => statusOf(c) === "progress").length}</b><span>en cours (1 réussite sur 2)</span></div>
      <div class="stat"><b>${all.filter(c => statusOf(c) === "ok").length}</b><span>maîtrisées</span></div>
      <div class="stat"><b>${topType ? esc(topType[0]) : "–"}</b><span>${topType ? `ton type d'erreur le plus fréquent (${topType[1]})` : "type d'erreur le plus fréquent"}</span></div>
    </div>
    ${all.length ? "" : `<div class="empty">Ton carnet est vide. Chaque question ratée y arrive automatiquement, avec ta réponse, la correction et la place pour noter pourquoi tu t'es trompé.</div>`}
    ${todo.length ? `<div class="row" style="margin-bottom:12px"><button class="btn primary" id="redoAll">Refaire les ${todo.length} questions à revoir</button>${untagged ? `<span class="small muted">${untagged} erreur${untagged > 1 ? "s" : ""} sans type : indique-le pour mieux cibler.</span>` : ""}</div>` : ""}
    ${all.length ? `<div class="panel">
      <div class="row small">
        <label>Statut <select id="fStatus"><option value="todo">À revoir et en cours</option><option value="ok">Maîtrisées</option><option value="all">Toutes</option></select></label>
        <label>Notion <select id="fK"><option value="">Toutes</option>${Object.keys(NOTIONS).map(k => `<option value="${k}">${NOTIONS[k].name}</option>`).join("")}</select></label>
        <label>Type <select id="fType"><option value="">Tous</option>${ERR_TYPES.map(t => `<option>${t}</option>`).join("")}</select></label>
      </div></div>` : ""}
    <div id="entries">${list.length ? list.map(entryHTML).join("") : all.length ? `<div class="empty">Aucune erreur ne correspond à ces filtres.</div>` : ""}</div>`;
  if ($("redoAll")) $("redoAll").onclick = () => startRun("Carnet d'erreurs", shuffle(todo.map(c => c.q)));
  if ($("fStatus")){
    $("fStatus").value = f.status; $("fK").value = f.k; $("fType").value = f.type;
    $("fStatus").onchange = e => { f.status = e.target.value; renderCarnet(); };
    $("fK").onchange = e => { f.k = e.target.value; renderCarnet(); };
    $("fType").onchange = e => { f.type = e.target.value; renderCarnet(); };
  }
  document.querySelectorAll(".entry").forEach(box => {
    const c = S.carnet[box.dataset.q];
    box.querySelector(".redo").onclick = () => startRun("Carnet d'erreurs", [c.q]);
    box.querySelector(".del").onclick = () => { if (confirm("Retirer cette question du carnet ?")){ delete S.carnet[c.q]; save(); renderCarnet(); } };
    box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      c.types = c.types || []; const t = b.dataset.type;
      c.types.includes(t) ? c.types.splice(c.types.indexOf(t), 1) : c.types.push(t);
      b.setAttribute("aria-pressed", c.types.includes(t)); save();
    });
    const ta = box.querySelector("textarea"); let h;
    ta.oninput = () => { clearTimeout(h); h = setTimeout(() => { c.note = ta.value; save(); }, 700); };
    ta.onblur = () => { clearTimeout(h); if (c.note !== ta.value){ c.note = ta.value; save(); } };
  });
}
function entryHTML(c){
  const q = BY_ID[c.q], s = statusOf(c);
  const pill = {open:"À revoir", progress:"En cours · 1 réussite sur 2", ok:"Maîtrisée"}[s];
  return `<div class="entry ${s}" data-q="${c.q}">
    <div class="row" style="justify-content:space-between"><h3>${NOTIONS[q.k].name} · ${esc(q.title)}</h3><span class="pill ${s}">${pill}</span></div>
    <div class="small muted">${badge(q.k)} Ratée ${c.count} fois · dernière erreur le ${fmtDate(c.last)} · ta dernière réponse fausse : ${letters(c.p || [])} · bonne réponse : ${letters(q.ok)}</div>
    <div class="preview">${q.stem}</div>
    <div class="chips" style="margin:8px 0">${ERR_TYPES.map(t => `<button class="chip" data-type="${esc(t)}" aria-pressed="${(c.types || []).includes(t)}">${t}</button>`).join("")}</div>
    <textarea placeholder="Pourquoi tu t'es trompé, la règle à retenir…">${esc(c.note || "")}</textarea>
    <details><summary>Voir l'énoncé complet et la correction</summary><div class="stem" style="margin-top:8px">${q.stem}</div>
      <ul style="list-style:none;padding:0;margin:0;font-family:var(--serif)">${q.props.map((p, i) => `<li style="padding:4px 0;border-bottom:1px dashed var(--rule)"><b>${L[i]}.</b> ${p}<br><span class="small" style="color:${q.ok.includes(i) ? "var(--ok)" : "var(--ko)"}">${q.why[i]}</span></li>`).join("")}</ul>
      <div class="corr"><h3>Correction pas à pas</h3><ol class="steps">${q.steps.map(x => `<li>${x}</li>`).join("")}</ol><div class="tip"><b>Piège :</b> ${q.tip}</div></div></details>
    <div class="row" style="margin-top:10px"><button class="btn small primary redo">Refaire cette question</button><button class="btn small danger del">Retirer du carnet</button></div></div>`;
}

/* ---------------- annales ---------------- */
let annNotions = new Set();
function renderAnnales(){
  const today = new Date().toISOString().slice(0, 10);
  const rows = S.annales.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const per = {}; S.annales.forEach(a => { const v = 20 * a.score / a.sur; const p = per[a.a] = per[a.a] || {n:0, best:0, last:null, lastT:0}; p.n++; p.best = Math.max(p.best, v); if ((a.ts || 0) >= p.lastT){ p.lastT = a.ts || 0; p.last = v; } });
  const f1 = v => (Math.round(v * 10) / 10).toString().replace(".", ",");
  $("main").innerHTML = `
    <div class="panel"><h2>Enregistrer une annale</h2>
      <div class="form">
        <div class="row">
          <div><label for="aSel">Sujet</label><select id="aSel">${ANNALES.map(([id, l]) => `<option value="${id}">${l}</option>`).join("")}</select></div>
          <div><label for="aDate">Date</label><input type="date" id="aDate" value="${today}"></div>
          <div><label for="aScore">Note</label><input type="number" id="aScore" min="0" step="0.5" placeholder="8,5"></div>
          <div><label for="aSur">Sur</label><input type="number" id="aSur" min="1" step="1" value="10"></div>
        </div>
        <div><label>Notions où tu as perdu des points (facultatif, sert à cibler tes points faibles)</label>
          <div class="chips" id="aNot">${Object.keys(NOTIONS).map(k => `<button class="chip" data-k="${k}" aria-pressed="${annNotions.has(k)}">${NOTIONS[k].name}</button>`).join("")}</div></div>
        <div><button class="btn primary" id="aSave">Enregistrer</button></div>
      </div></div>
    <div class="panel"><h2>Progression</h2>${chartHTML()}</div>
    <div class="panel"><h2>Par sujet</h2><div class="tw"><table class="list"><tr><th>Sujet</th><th>Passages</th><th>Dernière</th><th>Meilleure</th></tr>
      ${ANNALES.map(([id, l]) => { const p = per[id]; return `<tr><td>${l}</td><td>${p ? p.n : "–"}</td><td>${p ? f1(p.last) + "/20" : `<span class="muted small">pas encore fait</span>`}</td><td>${p ? f1(p.best) + "/20" : ""}</td></tr>`; }).join("")}
    </table></div></div>
    <div class="panel"><h2>Historique</h2>${rows.length ? `<div class="tw"><table class="list"><tr><th>Date</th><th>Sujet</th><th>Note</th><th>Points perdus sur</th><th></th></tr>
      ${rows.map(a => `<tr><td>${fmtDate(a.ts || Date.parse(a.date))}</td><td>${ANN_LABEL[a.a] || esc(a.a)}</td><td>${f1(a.score)}/${a.sur}${a.sur !== 20 ? ` <span class="small muted">(${f1(20 * a.score / a.sur)}/20)</span>` : ""}</td><td class="small">${(a.notions || []).map(k => NOTIONS[k] ? NOTIONS[k].name : k).join(", ") || "–"}</td><td><button class="btn small danger" data-del="${a.id}">Supprimer</button></td></tr>`).join("")}
    </table></div>` : `<div class="empty">Aucune annale enregistrée. Note ici tes résultats sur les vrais sujets pour suivre ta progression.</div>`}</div>`;
  document.querySelectorAll("#aNot .chip").forEach(b => b.onclick = () => { const k = b.dataset.k; annNotions.has(k) ? annNotions.delete(k) : annNotions.add(k); b.setAttribute("aria-pressed", annNotions.has(k)); });
  $("aSave").onclick = () => {
    const score = parseFloat(String($("aScore").value).replace(",", ".")), sur = parseFloat($("aSur").value), date = $("aDate").value;
    if (!isFinite(score) || !isFinite(sur) || sur <= 0 || score < 0 || score > sur){ toast("Indique une note valide (entre 0 et le total)."); return; }
    if (!date){ toast("Indique la date."); return; }
    S.annales.push({id:"a" + Date.now(), a:$("aSel").value, date, ts:Date.parse(date + "T12:00:00"), score, sur, notions:[...annNotions]});
    annNotions = new Set(); save(); toast("Annale enregistrée."); renderAnnales();
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (!confirm("Supprimer cette note ?")) return; S.annales = S.annales.filter(a => a.id !== b.dataset.del); save(); renderAnnales(); });
}

/* ---------------- export / import / reset ---------------- */
$("exportBtn").onclick = async () => {
  const data = JSON.stringify(S, null, 1), filename = "carnet-ue14-" + new Date().toISOString().slice(0, 10) + ".json";
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl){ await dl.save({filename, data}); return; }
  } catch(e){ if (e && e.code && e.code !== "unavailable") { toast("Export annulé."); return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
};
$("importFile").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const x = JSON.parse(await file.text());
    if (!x || !Array.isArray(x.attempts) || typeof x.carnet !== "object") throw 0;
    if (!confirm("Remplacer tes données actuelles par celles de ce fichier ?")) return;
    S = normalize(x); save(); render(); toast("Données importées.");
  } catch(err){ toast("Ce fichier n'est pas une sauvegarde du carnet."); }
  e.target.value = "";
};
$("resetBtn").onclick = () => { if (!confirm("Effacer toutes tes données (tentatives, carnet, annales) ? Pense à exporter avant.")) return; S = emptyState(); save(); run = null; exam = null; render(); };

render();
initRemote();
</script>
